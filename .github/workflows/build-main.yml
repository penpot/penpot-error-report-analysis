name: _MAIN

run-name: >-
  _MAIN (main)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and overwrite even if this build already exists'
        type: boolean
        required: false
        default: false
  # Disabled for now: run only manually from GitHub Actions.
  # schedule:
  #   - cron: '26 5-20 * * 1-5'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-docker:
    name: Build and publish images (web, mcp)
    permissions:
      contents: read
    uses: ./.github/workflows/build-docker.yml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
      PUB_DOCKER_PASSWORD: ${{ secrets.PUB_DOCKER_PASSWORD }}
      PUB_DOCKER_USERNAME: ${{ secrets.PUB_DOCKER_USERNAME }}
    with:
      gh_ref: "main"
      force: ${{ inputs.force || false }}
