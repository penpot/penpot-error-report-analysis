# The reverse proxy fronting the analysis platform's two servers, exposing both under a
# single port: the dashboard at the root path and the MCP endpoint at /mcp.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # temporary paths below /tmp, as the server runs as an unprivileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    error_log /dev/stderr;
    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080 default_server;
        server_name _;
        charset utf-8;
        client_max_body_size 16m;

        # relative redirects, the externally visible address being the proxy's, not the server's
        absolute_redirect off;

        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;

        # The MCP server's streamable HTTP endpoint, which the server exposes at this exact
        # path. Its responses are server-sent event streams that remain open for the duration
        # of a session, hence response buffering is disabled and the timeouts are raised.
        # The Host header carries the upstream address, because the server's DNS rebinding
        # protection admits loopback hosts only.
        location = /mcp {
            proxy_pass http://127.0.0.1:5101;
            proxy_set_header Host $proxy_host;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # the endpoint's trailing-slash spelling, which the MCP server itself does not serve
        location = /mcp/ {
            return 308 /mcp;
        }

        # the dashboard, serving the static application and its JSON API
        location / {
            proxy_pass http://127.0.0.1:5100;
        }
    }
}
